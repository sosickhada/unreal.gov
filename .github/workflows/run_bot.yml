name: Unreal Bureau Bot Interactive

on:
  schedule:
    - cron: '0 9 * * *' # 매일 오전 9시 (한국 시간 기준 저녁 6시) 자동 실행
  workflow_dispatch:
    inputs:
      action_type:
        description: '실행할 작업 선택'
        required: true
        default: 'generate_trends'
        type: choice
        options:
          - generate_trends
          - select_choice
          - reject_regenerate
      choice_number:
        description: '선택할 후보 번호 (select_choice 시 입력: 1, 2, 3)'
        required: false
        default: '1'
        type: string

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests google-generativeai

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACTION_TYPE: ${{ github.event.inputs.action_type }}
          CHOICE_NUMBER: ${{ github.event.inputs.choice_number }}
        run: |
          python bot.py
