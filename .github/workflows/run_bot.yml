name: Unreal Bureau Bot

on:
  schedule:
    # GitHub Actions cron uses UTC: 09:00 UTC = 18:00 KST
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      action_type:
        description: '실행할 작업'
        required: true
        default: 'generate_trends'
        type: choice
        options:
          - generate_trends
          - select_choice
          - reject_regenerate
      choice_number:
        description: '선택 후보 번호 (후보 저장/선택 기능 구현 후 사용)'
        required: false
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACTION_TYPE: ${{ inputs.action_type || 'generate_trends' }}
          CHOICE_NUMBER: ${{ inputs.choice_number || '1' }}
          MAX_AGE_HOURS: '72'
        run: python bot.py
