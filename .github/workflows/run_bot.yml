name: Unreal Bureau Bot

on:
  schedule:
    # GitHub Actions cron uses UTC: 09:00 UTC = 18:00 KST
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      action_type:
        description: '실행할 작업'
        required: true
        default: 'generate_trends'
        type: choice
        options:
          - generate_trends
          - select_choice
          - reject_regenerate
      choice_number:
        description: '선택 후보 번호 (후보 저장/선택 기능 구현 후 사용)'
        required: false
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  run-bot:
    # Safety gate: VM migration must disable this workflow in GitHub before enabling timer.
    # New manual dispatch lives in manual_vm.yml and shares the VM database.
    if: ${{ vars.LEGACY_CLOUD_EXECUTION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACTION_TYPE: ${{ inputs.action_type || 'generate_trends' }}
          CHOICE_NUMBER: ${{ inputs.choice_number || '1' }}
          MAX_AGE_HOURS: '72'
        run: |
          echo 'Legacy cloud execution retired. Use VM manual enqueue workflow.'
          exit 1
